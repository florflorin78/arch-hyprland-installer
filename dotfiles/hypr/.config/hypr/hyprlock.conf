# hyprlock — ecran de blocare în tema neon
general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/Pictures/wallpapers/badass-dark.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    color = rgb(e6e6f0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(8d93aa)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(ff2e63)
    inner_color = rgb(0b0b12)
    font_color = rgb(e6e6f0)
    check_color = rgb(08d9d6)
    fail_color = rgb(ff2e63)
    fade_on_empty = false
    placeholder_text = <i>parola...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -60
    halign = center
    valign = center
}
