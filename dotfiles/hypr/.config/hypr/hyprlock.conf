# hyprlock
general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/Pictures/wallpapers/matrix-rain.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    color = rgb(d4ffe0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(5f8f6e)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(39ff7a)
    inner_color = rgb(020a05)
    font_color = rgb(d4ffe0)
    check_color = rgb(22d36b)
    fail_color = rgb(ff4d4d)
    fade_on_empty = false
    capslock_color = rgb(f5c542)
    placeholder_text = <i>password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER@cmd[update:0] hostname
    color = rgb(22d36b)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(5f8f6e)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -160
    halign = center
    valign = center
}
