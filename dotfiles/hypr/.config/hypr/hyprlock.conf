# hyprlock
general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/Pictures/wallpapers/cyber-clean.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}

image {
    monitor =
    path = ~/.config/hypr/avatar.png
    size = 150
    rounding = -1
    border_size = 3
    border_color = rgb(e5c95a)
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(ece6d6)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(6b7385)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(e5c95a)
    inner_color = rgb(0a0c12)
    font_color = rgb(ece6d6)
    check_color = rgb(4fb8c4)
    fail_color = rgb(e05a6f)
    fade_on_empty = false
    capslock_color = rgb(e8a13a)
    placeholder_text = <i>password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "$USER@$(cat /proc/sys/kernel/hostname)"
    color = rgb(4fb8c4)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(6b7385)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
}
