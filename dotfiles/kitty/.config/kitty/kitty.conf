# kitty — terminal GPU, dark neon
font_family      JetBrainsMono Nerd Font
font_size        11.0
disable_ligatures never

background_opacity 0.92
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
copy_on_select clipboard
shell zsh

# smoothness
cursor_shape block
cursor_blink_interval 0.6
cursor_trail 3
cursor_trail_decay 0.1 0.4
repaint_delay 8
input_delay 2
sync_to_monitor yes
scrollback_lines 20000

# splits + tabs
enabled_layouts splits,stack
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# --- Tabs ---
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# --- Splits ---
map ctrl+shift+backslash launch --location=vsplit --cwd=current
map ctrl+shift+minus     launch --location=hsplit --cwd=current
map ctrl+alt+h neighboring_window left
map ctrl+alt+l neighboring_window right
map ctrl+alt+k neighboring_window up
map ctrl+alt+j neighboring_window down
map ctrl+shift+z toggle_layout stack

# --- Navigation / hints ---
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
map ctrl+shift+g show_last_command_output

# colors
foreground              #b8f5c8
background              #020a05
selection_foreground    #020a05
selection_background    #39ff7a
cursor                  #22d36b
url_color               #22d36b
