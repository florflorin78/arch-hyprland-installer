add_newline = true
command_timeout = 500

format = "$username$hostname$directory$git_branch$git_status$python$rust$nodejs$golang$docker_context$cmd_duration$character"

[character]
success_symbol = "[\\$](bold #39ff7a) "
error_symbol = "[\\$](bold #ff4d4d) "

[username]
show_always = true
style_user = "bold #39ff7a"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
ssh_symbol = " "
style = "bold #22d36b"
format = "[@](#5f8f6e)[$hostname]($style)[:](#5f8f6e)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
style = "bold #22d36b"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold #0fa84a"

[git_status]
style = "#f5c542"

[cmd_duration]
min_time = 2000
style = "#5f8f6e"
format = "[ took $duration]($style)"

[python]
format = "[ py $version]($style)"
style = "#f5c542"

[rust]
format = "[ rs $version]($style)"
style = "#8dffb0"

[nodejs]
format = "[ node $version]($style)"
style = "#7dffa8"

[golang]
format = "[ go $version]($style)"
style = "#22d36b"
