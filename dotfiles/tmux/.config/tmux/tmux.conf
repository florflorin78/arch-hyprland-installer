# tmux — prefix Ctrl+a, taste vim
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -g escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g mode-keys vi
set -g focus-events on

# splits în directorul curent
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# navigare / redimensionare vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy mode vim -> clipboard Wayland
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

bind r source-file ~/.config/tmux/tmux.conf \; display "config reîncărcat"

# aspect
set -g status-position top
set -g status-style "bg=#0b0b12,fg=#8d93aa"
set -g status-left "#[bg=#ff2e63,fg=#0b0b12,bold]  #S #[default] "
set -g status-right "#[fg=#08d9d6]%H:%M  #[fg=#8c3cff]%d %b "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#ff2e63,bold] #I:#W "
set -g pane-border-style "fg=#2a2a3a"
set -g pane-active-border-style "fg=#ff2e63"
set -g message-style "bg=#14141f,fg=#08d9d6"
