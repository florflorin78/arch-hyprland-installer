# tmux — prefix Ctrl+a, vim keys
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -g escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g mode-keys vi
set -g focus-events on

# splits keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim navigation / resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vim copy mode -> Wayland clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# look
set -g status-position top
set -g status-style "bg=#020a05,fg=#5f8f6e"
set -g status-left "#[bg=#39ff7a,fg=#020a05,bold]  #S #[default] "
set -g status-right "#[fg=#22d36b]%H:%M  #[fg=#0fa84a]%d %b "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#39ff7a,bold] #I:#W "
set -g pane-border-style "fg=#0f3a1e"
set -g pane-active-border-style "fg=#39ff7a"
set -g message-style "bg=#06140b,fg=#22d36b"
